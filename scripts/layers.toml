# The package layer map (register phase 3, DES-13).
#
# `layers` lists the packages from the top of the stack to the bottom; `|`
# separates siblings, which may not import each other. A package imports only
# the layers below it. `step` lists the module moves that get there, in the
# order they land, one target package per commit. Each move maps an old dotted
# path (a module or a whole package) to its new one; `scripts/move.py` applies
# a step and `scripts/structure.py --simulate` applies the whole map to the
# current import graph and prints every import that still breaks the order.
#
# `packages` gives the docstring of each package a step creates.

layers = [
    "cli | rehearsal",
    "serving | workflow",
    "operations | runners",
    "api",
    "deploy | pipeline | security | trail",
    "governance",
    "monitoring",
    "artifacts",
    "causal | decision",
    "assurance | explainability | inference",
    "evaluation",
    "models",
    "preparation",
    "data",
    "storage",
    "envelope | optimization | runtime | unsupervised",
    "certificates | contracts | durability",
]

[packages]
runtime = "Process runtime: randomness, retries, limits, budgets, logs, workers."
storage = "Object stores, store conformance and experiment stores."
preparation = "Fold-local preprocessing, selection, sampling and task wrappers."
assurance = "Evidence that a run is sound: ledger, charter, detectors, admissibility, custody, framing, ingest, robustness and coverage."
causal = "Causal identification and causal claims."
pipeline = "The run pipeline: context, stages, orchestrator, search, planning and profiling."
serving = "The prediction servers and the service runtime."
rehearsal = "Operations rehearsals: the demo and the fault harnesses."

[[step]]
name = "runtime"
moves = [
    ["scmle.core.randomness", "scmle.runtime.randomness"],
    ["scmle.core.retry", "scmle.runtime.retry"],
    ["scmle.core.limits", "scmle.runtime.limits"],
    ["scmle.core.ipc", "scmle.runtime.ipc"],
    ["scmle.core.resource_observation", "scmle.runtime.resource_observation"],
    ["scmle.core.state", "scmle.runtime.state"],
    ["scmle.core.config", "scmle.runtime.config"],
    ["scmle.core.scheduler", "scmle.runtime.scheduler"],
