# Rename map, lane 3.4: every other scmle package.
#
# One `dotted.old.name = "new"` entry per definition; a method or
# attribute is listed once for its overriding family (rename.py
# renames every override). Applied with
#     uv run python scripts/rename.py rest --dry-run
# which works once rename.py's read() drops the [review] table
# before flattening (until then it raises ValueError on it); meanwhile
# run `--map` on a copy of this file without the [review] table.
# The [review] table lists names no single word fits without
# ambiguity, with two or three candidates and the reason; rename.py
# reads only the top-level entries. A candidate equal to the old name
# means keeping it. The trailing comment block lists
# the names that are not mapped and why.
#
# After the --write apply, fix by hand the docstring of
# scmle/contracts/evaluation/parts.py:461 (Requirement.spelling): it
# says `required_evidence` is stored as `evidence`, and the rename
# turns that into "`evidence` is stored as `evidence`". Once the
# attribute is `evidence`, that spelling entry maps a key to itself
# and can go.

