# Rename map, lane 3.1: scmle/data, scmle/assurance.
#
# One `dotted.old.name = "new"` entry per definition; a method or
# attribute is listed once for its overriding family (rename.py
# renames every override). Applied with
#     uv run python scripts/rename.py data_assurance --dry-run
# which works once rename.py's read() drops the [review] table
# before flattening (until then it raises ValueError on it); meanwhile
# run `--map` on a copy of this file without the [review] table.
# The [review] table lists names no single word fits without
# ambiguity, with two or three candidates and the reason; rename.py
# reads only the top-level entries. A candidate equal to the old name
# means keeping it. The trailing comment block lists
# the names that are not mapped and why.
#
# After the --write apply, restore by hand the legacy key spelling in
# every docstring that cites a `Migration.renames` source key: the
# rename rewrites the old key to the new name, so the record of the
# written layout reads "spells `calibration` as `calibration`". The
# dry run on the working tree names these sites:
#     scmle/assurance/admissibility/reconciliation.py:186 (`residual_gap`)
#     scmle/assurance/coverage_slices.py:63 (`min_rows`)
#     scmle/assurance/framing/draft/records.py:137 (`open_items`)
#     scmle/assurance/framing/questions.py:59 (`tipping_value`)
#     scmle/assurance/framing/refusal.py:345 (`n_calibration`)
#     scmle/assurance/ingest/grain.py:479 (`unit_columns`)
#     scmle/assurance/ingest/profile.py:222 (`non_null`)
#     scmle/assurance/ingest/reconcile.py:82 (`not_reconciled`)
#     scmle/assurance/ingest/synthesize/selection.py:52 (`declared_family_size`)
#     scmle/assurance/robustness/coverage.py:45 (`deployment_share`)
#     scmle/assurance/robustness/shift.py:563 (`low_counts`)
# Grep the dry run for "spell" again before applying: any other
# docstring that cites a renamed source key needs the same fix.

