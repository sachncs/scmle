name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-controls:
    name: hosted workflow and release controls
    # Pin Ubuntu until the 26.04 image migration is validated for SCMLE.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify hosted controls without credentials
        run: python3 scripts/verify_hosted_controls.py --root .

  quality:
    name: lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python ${{ matrix.python }} --extra boosting --extra optimization --extra multimodal
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy scmle benchmarks
      - run: uv run python scripts/check_api_compatibility.py tests/fixtures/public_api.json
      # Keep pull requests bounded. The scheduled full-suite workflow retains
      # coverage for every integration and optional path.
      - run: >-
          uv run pytest -q --cov=scmle --cov-report=xml
          -W error::ResourceWarning
          --cov-fail-under=75
          tests/unit tests/property tests/leakage
          tests/integration/test_cli.py
          tests/integration/test_end_to_end.py
          tests/integration/test_predict_api.py
          tests/integration/test_governance.py
          tests/integration/test_problem_spec.py
          tests/integration/test_serve_and_export.py
          --junitxml=bounded-suite.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py bounded-suite.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.14'
        with:
          name: coverage
          path: |
            coverage.xml
            bounded-suite.xml

  cross-platform:
    name: ${{ matrix.os }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: LightGBM needs the OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --python ${{ matrix.python }} --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
          --junitxml=cross-platform.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py cross-platform.xml
      - name: Smoke test the CLI
        run: uv run scmle --help

  minimal-dependencies:
    name: lowest supported dependency versions (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.11 --resolution lowest-direct --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          --junitxml=minimal-dependencies.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py minimal-dependencies.xml

  deep-learning:
    name: PyTorch model families (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.12 --extra deeplearning --extra boosting
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit/test_deeplearning.py tests/unit/test_jepa_contract.py
          tests/unit/test_training.py
          --junitxml=deep-learning.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py deep-learning.xml

  reliability:
    name: bounded fault and recovery matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - name: Execute local fault matrix
        run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit/test_reliability_contracts.py
          tests/unit/test_reliability_harness.py
          tests/unit/test_local_faults.py
          tests/unit/test_independent_review.py
          tests/unit/test_incidents.py
          --junitxml=reliability.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py reliability.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reliability-matrix
          path: reliability.xml
          if-no-files-found: error

  optional-capabilities:
    name: all optional capability paths (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install every declared optional extra
        run: uv sync --python 3.13 --all-extras
      - name: Exercise optional capability matrix
        run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit/test_boosting.py
          tests/unit/test_early_stopping.py
          tests/unit/test_onnx_export.py
          tests/unit/test_resampling.py
          tests/unit/test_readers.py
          tests/integration/test_interchange.py
          tests/unit/test_deeplearning.py
          tests/unit/test_keras.py
          tests/unit/test_embeddings.py
          tests/integration/test_integrations.py
          tests/integration/test_ray_cluster.py
          tests/integration/test_text_embedding_run.py
          --junitxml=optional-capabilities.xml
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py optional-capabilities.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: optional-capabilities
          path: optional-capabilities.xml
          if-no-files-found: error

  integrations:
    name: MLflow and Ray integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra optimization --extra tracking --extra distributed
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/integration/test_integrations.py
          --junitxml=integrations.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py integrations.xml
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"  # workers must use this venv

  base-install:
    name: base install without extras
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/integration/test_end_to_end.py
          --junitxml=base-install.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py base-install.xml

  data-formats:
    name: dataset formats and optional curation dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra spreadsheets
      - run: >-
          uv run pytest -q tests/unit/test_readers.py
          -W error::ResourceWarning
          tests/unit/test_streaming.py
          tests/integration/test_interchange.py
          --junitxml=data-formats.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py data-formats.xml

  benchmarks:
    name: benchmark regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra boosting --extra optimization
      - run: uv run python -m benchmarks.run_benchmarks --offline --seeds 5 --budget 120 --workers 2 --output results.json
      - run: uv run python -m benchmarks.check_regression results.json
      - run: uv run python -m benchmarks.reliability --output reliability.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: |
            results.json
            reliability.json

  security:
    name: static analysis and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - run: uv run bandit -q -r scmle
      - run: uv run pip-audit --skip-editable
      - name: Validate runtime dependency licenses
        run: uv run python scripts/check_dependency_licenses.py --output dependency-licenses.json
      - name: Generate deterministic CycloneDX SBOM
        run: |
          uv run python - <<'PY'
          import json
          import os
          from importlib.metadata import distributions
          from pathlib import Path

          import scmle
          from scmle.governance import sbom

          packages = {
              str(distribution.metadata["Name"]): distribution.version
              for distribution in distributions()
              if distribution.metadata.get("Name")
          }
          record = sbom.build(
              packages,
              run_id=f"ci-{os.environ['GITHUB_SHA']}",
              software_version=scmle.__version__,
          )
          Path("sbom.cyclonedx.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-licenses
          path: dependency-licenses.json
          if-no-files-found: error

  security-all-extras:
    name: optional-extra security and license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # `uv run` would otherwise pick .python-version (3.14), delete the 3.13
      # environment built with every extra and audit a bare install instead.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install every declared optional extra
        run: uv sync --python 3.13 --all-extras
      - name: Audit optional-extra dependencies
        run: uv run pip-audit
      - name: Validate optional-extra licenses
        run: >-
          uv run python scripts/check_dependency_licenses.py
          --all-extras --output dependency-licenses-all-extras.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-licenses-all-extras
          path: dependency-licenses-all-extras.json
          if-no-files-found: error

  package:
    name: build and verify distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build --python 3.14
      - run: uv run --python 3.14 twine check dist/*
      - name: Verify reproducible and network-isolated artifacts
        run: scripts/verify_release_artifacts.sh
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python 3.14 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/scmle --help
          /tmp/wheel-env/bin/python -c "import scmle; print(scmle.__version__)"
      - name: Install the source distribution into a clean environment
        run: |
          uv venv --python 3.14 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env/bin/python dist/*.tar.gz
          /tmp/sdist-env/bin/scmle --help
          /tmp/sdist-env/bin/python -c "import scmle; print(scmle.__version__)"
