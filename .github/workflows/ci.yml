name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python ${{ matrix.python }} --extra boosting --extra optimization --extra multimodal
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy scml benchmarks
      - run: uv run python scripts/check_api_compatibility.py tests/fixtures/public_api.json
      # Keep pull requests bounded. The scheduled full-suite workflow retains
      # coverage for every integration and optional path.
      - run: >-
          uv run pytest -q --cov=scml --cov-report=xml
          -W error::ResourceWarning
          --cov-fail-under=50
          tests/unit tests/property tests/leakage
          tests/integration/test_cli.py
          tests/integration/test_end_to_end.py
          tests/integration/test_predict_api.py
          tests/integration/test_serve_and_export.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.14'
        with:
          name: coverage
          path: coverage.xml

  cross-platform:
    name: ${{ matrix.os }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: LightGBM needs the OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --python ${{ matrix.python }} --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
      - name: Smoke test the CLI
        run: uv run scml --help

  minimal-dependencies:
    name: lowest supported dependency versions (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.11 --resolution lowest-direct --extra boosting --extra optimization --extra multimodal
      - run: uv run pytest -q -W error::ResourceWarning tests/unit tests/property tests/leakage

  deep-learning:
    name: PyTorch model families (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.12 --extra deeplearning --extra boosting
      - run: uv run pytest -q -W error::ResourceWarning tests/unit/test_deeplearning.py tests/unit/test_training.py

  integrations:
    name: MLflow and Ray integrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra optimization --extra tracking --extra distributed
      - run: uv run pytest -q -W error::ResourceWarning tests/integration/test_integrations.py
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"  # workers must use this venv

  base-install:
    name: base install without extras
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - run: uv run pytest -q -W error::ResourceWarning tests/unit tests/property tests/integration/test_end_to_end.py

  data-formats:
    name: dataset formats and optional curation dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra spreadsheets
      - run: >-
          uv run pytest -q tests/unit/test_readers.py
          -W error::ResourceWarning
          tests/unit/test_streaming.py
          tests/integration/test_interchange.py

  benchmarks:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra boosting --extra optimization
      - run: uv run python -m benchmarks.run_benchmarks --offline --seeds 5 --budget 120 --workers 2 --output results.json
      - run: uv run python -m benchmarks.check_regression results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: results.json

  security:
    name: static analysis and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - run: uv run bandit -q -r scml
      - run: uv run pip-audit --skip-editable
      - name: Validate runtime dependency licenses
        run: uv run python scripts/check_dependency_licenses.py --output dependency-licenses.json
      - name: Generate deterministic CycloneDX SBOM
        run: |
          uv run python - <<'PY'
          import json
          import os
          from importlib.metadata import distributions
          from pathlib import Path

          import scml
          from scml.governance import sbom

          packages = {
              str(distribution.metadata["Name"]): distribution.version
              for distribution in distributions()
              if distribution.metadata.get("Name")
          }
          record = sbom.build(
              packages,
              run_id=f"ci-{os.environ['GITHUB_SHA']}",
              software_version=scml.__version__,
          )
          Path("sbom.cyclonedx.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-licenses
          path: dependency-licenses.json
          if-no-files-found: error

  security-all-extras:
    name: optional-extra security and license audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install every declared optional extra
        run: uv sync --python 3.13 --all-extras
      - name: Audit optional-extra dependencies
        run: uv run pip-audit
      - name: Validate optional-extra licenses
        run: >-
          uv run python scripts/check_dependency_licenses.py
          --all-extras --output dependency-licenses-all-extras.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-licenses-all-extras
          path: dependency-licenses-all-extras.json
          if-no-files-found: error

  package:
    name: build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build --python 3.14
      - run: uv run --python 3.14 twine check dist/*
      - name: Verify reproducible and network-isolated artifacts
        run: scripts/verify_release_artifacts.sh
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python 3.14 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/scml --help
          /tmp/wheel-env/bin/python -c "import scml; print(scml.__version__)"
      - name: Install the source distribution into a clean environment
        run: |
          uv venv --python 3.14 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env/bin/python dist/*.tar.gz
          /tmp/sdist-env/bin/scml --help
          /tmp/sdist-env/bin/python -c "import scml; print(scml.__version__)"
