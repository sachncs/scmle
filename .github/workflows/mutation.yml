name: mutation

# Run by hand (Actions > mutation > Run workflow). It is not part of the
# nightly full suite or of any push check: the whole scope is about 42,000
# mutants, which takes more than six hours on one hosted runner. The last
# partial run (32,010 of 41,746 mutants) killed 78.6 percent of the scored
# mutants. The floor of 70 percent is no longer enforced automatically; run
# this, or `uv run mutmut run` locally, before a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: critical mutation score (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # one hosted job cannot finish the whole scope inside its time limit
        # (about 42,000 mutants), so each shard runs its own mutants and is
        # held to the same floor
        shard:
          - name: benchmarks
            patterns: "benchmarks.*"
          - name: data
            patterns: "scmle.data.*"
          - name: evaluation
            patterns: "scmle.evaluation.*"
          - name: rest
            patterns: "scmle.contracts.* scmle.core.* scmle.artifacts.* scmle.governance.* scmle.inference.* scmle.monitoring.*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - name: Enforce critical mutation score
        env:
          PATTERNS: ${{ matrix.shard.patterns }}
        run: |
          # shellcheck disable=SC2086
          uv run mutmut run --max-children 4 $PATTERNS
          scripts/check_mutation_score.sh 70
