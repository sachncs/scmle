name: Deploy documentation site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install site dependencies
        run: npm ci
        working-directory: website
      - name: Audit site dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: website
      - name: Build site
        run: npm run build
        working-directory: website
      - name: Check site accessibility
        run: npm run check:a11y
        working-directory: website
      - name: Check internal links
        run: npm run check:links
        working-directory: website
      - name: Verify hosted controls without credentials
        run: python3 scripts/verify_hosted_controls.py --root .
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Run browser smoke tests
        run: npm run test:e2e
        working-directory: website
      - name: Smoke test generated routes
        run: |
          python3 -m http.server 4173 --directory website/dist > /tmp/scmle-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for route in / /docs/ /docs/quickstart/ /docs/data/ /docs/modalities/ /docs/capabilities/ /docs/modeling/ /docs/evidence/ /docs/workflows/ /docs/api/ /docs/architecture/ /docs/cards/ /docs/operations/ /docs/security/ /docs/recovery/ /docs/migrations/ /docs/troubleshooting/; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${route}" > /dev/null
          done
          grep -q "/scmle/docs/" website/dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python3 scripts/verify_hosted_controls.py \
            --root . \
            --pages-url "${PAGE_URL%/}" \
            --output hosted-pages-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hosted-pages-verification
          path: hosted-pages-verification.json
          if-no-files-found: error
