name: site

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check:a11y
      - name: Smoke test generated routes
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/super-charge-ml-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for route in / /docs/ /docs/quickstart/ /docs/data/ /docs/capabilities/ /docs/evidence/ /docs/workflows/ /docs/api/ /docs/architecture/ /docs/operations/ /docs/troubleshooting/; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${route}" > /dev/null
          done
          grep -q "/super-charge-ml/docs/" dist/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for route in / /docs/ /docs/quickstart/ /docs/data/ /docs/capabilities/ /docs/evidence/ /docs/workflows/ /docs/api/ /docs/architecture/ /docs/operations/ /docs/troubleshooting/; do
            curl --fail --silent --show-error --location "${PAGE_URL%/}${route}" > /dev/null
          done
