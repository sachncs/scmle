name: site

on:
  push:
    branches: [master, "feat/**"]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check:a11y
      - run: npm run check:links
      - name: Verify hosted controls without credentials
        run: python3 scripts/verify_hosted_controls.py --root .
        working-directory: .
      - name: Smoke test generated routes
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/scmle-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          # The server starts in the background; wait until it accepts
          # connections instead of racing it (curl exit 7 otherwise).
          for _ in $(seq 1 50); do
            curl --silent --output /dev/null "http://127.0.0.1:4173/" && break
            sleep 0.2
          done
          for route in / /docs/ /docs/quickstart/ /docs/data/ /docs/modalities/ /docs/capabilities/ /docs/modeling/ /docs/evidence/ /docs/workflows/ /docs/api/ /docs/architecture/ /docs/cards/ /docs/operations/ /docs/security/ /docs/recovery/ /docs/migrations/ /docs/troubleshooting/; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${route}" > /dev/null
          done
          grep -q "/scmle/docs/" dist/index.html
