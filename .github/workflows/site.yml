name: site

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check:a11y
      - name: Smoke test generated routes
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/super-charge-ml-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for route in / /docs/ /docs/quickstart/ /docs/data/ /docs/capabilities/ /docs/evidence/ /docs/workflows/ /docs/api/ /docs/architecture/ /docs/operations/ /docs/troubleshooting/; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${route}" > /dev/null
          done
          grep -q "/super-charge-ml/docs/" dist/index.html
