name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches the package version and the changelog
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('scmle/__init__.py').read()).group(1))")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          [ "${init}" = "${version}" ] || { echo "scmle.__version__ ${init} != ${version}"; exit 1; }
          grep -q "^## ${version}" CHANGELOG.md || { echo "CHANGELOG has no ${version} section"; exit 1; }

  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: LightGBM needs the OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
          --junitxml=release-platform.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py release-platform.xml

  release-checks:
    name: staged release checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Run staged release preflight
        env:
          SCMLE_PYTHON_VERSION: "3.14"
        run: ./scripts/release_preflight.sh

  publish:
    needs: [test, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no API token is stored.
      contents: write   # Create the GitHub release.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: uv run pytest -q -W error::ResourceWarning --junitxml=release-full-suite.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py release-full-suite.xml
      - run: uv run python -m benchmarks.run_benchmarks --offline --seeds 5 --budget 120 --workers 2 --output results.json
      - run: uv run python -m benchmarks.check_regression results.json
      - run: uv build --python 3.14
      - run: uv run twine check dist/*
      - name: Verify reproducible and network-isolated artifacts
        run: scripts/verify_release_artifacts.sh
      - name: Smoke test the wheel and source distribution
        run: |
          uv venv --python 3.14 /tmp/release-wheel-env
          uv pip install --python /tmp/release-wheel-env/bin/python dist/*.whl
          /tmp/release-wheel-env/bin/scmle --help
          /tmp/release-wheel-env/bin/python -c "import scmle; print(scmle.__version__)"
          uv venv --python 3.14 /tmp/release-sdist-env
          uv pip install --python /tmp/release-sdist-env/bin/python dist/*.tar.gz
          /tmp/release-sdist-env/bin/scmle --help
          /tmp/release-sdist-env/bin/python -c "import scmle; print(scmle.__version__)"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 ~ "^"v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
      - name: Verify public release bytes without credentials
        run: >-
          uv run python scripts/verify_external_release.py
          --repository "${GITHUB_REPOSITORY}"
          --tag "${GITHUB_REF_NAME}"
          --source-commit "${GITHUB_SHA}"
          --artifact-dir dist
          --pypi-project scmle
          --attempts 6
          --retry-delay 10
