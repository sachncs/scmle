name: release

on:
  push:
    tags: ["v*"]
  # The image job also runs on changes to what goes into the image; every
  # other job runs only for a release tag.
  pull_request:
    paths:
      - Dockerfile
      - deploy/requirements.lock
      - scmle/deploy/**
      - scmle/runners/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.12
      - run: uv build --wheel --python 3.12 --out-dir dist
      - name: Build the image (pinned base, hashed wheel) and smoke-test scmle --help as non-root
        run: uv run python -m scmle.deploy.packaging image --wheel dist/scmle-*.whl --tag scmle:ci
      - name: A tiny run inside the image through the container runner
        run: |
          uv run python - "${RUNNER_TEMP}/job.json" <<'PY'
          import json
          import sys

          from scmle.runners import base

          options = {
              "time_budget": 20,
              "search": {"top_models": 0},
              "models": {"exclude_families": ["boosting", "deep_learning"]},
          }
          spec = base.Job(
              run_id="ci-tiny",
              name="tiny",
              project={"data": "data/train.csv", "target": "churned", "options": options},
              identity="ci-train",
              timeout_seconds=900,
          )
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(spec.to_dict(), handle)
          PY
          uv run python -m scmle.runners.local --runner container --image scmle:ci \
            --store "${RUNNER_TEMP}/store" --spec "${RUNNER_TEMP}/job.json" \
            --serving ci-serve --put data/train.csv=deploy/local/data/train.csv
          test -s "${RUNNER_TEMP}/store/runs/ci-tiny/result.json"
      - name: Runner and image tests against the built image
        env:
          SCMLE_IMAGE: scmle:ci
          OMP_NUM_THREADS: "1"
        run: >-
          uv run pytest -q tests/integration/test_container_runner.py
          tests/unit/test_runner_process.py tests/unit/test_image_build.py
          --junitxml=image.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py image.xml

  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Release tags are protected from deletion and from being moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --python 3.14 python -m benchmarks.evidence.supply
          --protected "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}"
      - name: Tag matches the package version and the changelog
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('scmle/__init__.py').read()).group(1))")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          [ "${init}" = "${version}" ] || { echo "scmle.__version__ ${init} != ${version}"; exit 1; }
          grep -qE "^## \[?${version}\]?( |$)" CHANGELOG.md || { echo "CHANGELOG has no ${version} section"; exit 1; }

  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: LightGBM needs the OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
          --junitxml=release-platform.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py release-platform.xml

  release-checks:
    name: staged release checks
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Run staged release preflight
        env:
          SCMLE_PYTHON_VERSION: "3.14"
        run: ./scripts/release_preflight.sh

  publish:
    needs: [image, test, release-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing and Sigstore signing; no key is stored.
      contents: write   # Create the GitHub release.
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: uv run pytest -q -W error::ResourceWarning --junitxml=release-full-suite.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py release-full-suite.xml
      - run: uv run python -m benchmarks.run_benchmarks --offline --seeds 5 --budget 120 --workers 2 --output results.json
      - run: uv run python -m benchmarks.check_regression results.json
      - run: uv run python -m benchmarks.reliability --output reliability.json
      - run: uv build --python 3.14
      - run: uv run twine check dist/*
      - name: Verify reproducible and network-isolated artifacts
        run: scripts/verify_release_artifacts.sh
      - name: Smoke test the wheel and source distribution
        run: |
          uv venv --python 3.14 /tmp/release-wheel-env
          uv pip install --python /tmp/release-wheel-env/bin/python dist/*.whl
          /tmp/release-wheel-env/bin/scmle --help
          /tmp/release-wheel-env/bin/python -c "import scmle; print(scmle.__version__)"
          uv venv --python 3.14 /tmp/release-sdist-env
          uv pip install --python /tmp/release-sdist-env/bin/python dist/*.tar.gz
          /tmp/release-sdist-env/bin/scmle --help
          /tmp/release-sdist-env/bin/python -c "import scmle; print(scmle.__version__)"
      - name: No known high vulnerability in the locked dependencies
        # pip-audit exits 1 on any finding; the gate reads its report and
        # decides, failing closed on a finding with no severity and on an
        # unreadable report (scmle.deploy.vuln_gate).
        run: |
          uv export --frozen --all-extras --no-emit-project --output-file audit-requirements.txt
          status=0
          uv run pip-audit --requirement audit-requirements.txt --no-deps --disable-pip --format json --output audit.json || status=$?
          echo "pip-audit exited ${status}; the gate decides"
          uv run python -m scmle.deploy.vuln_gate audit.json --policy deploy/vuln-policy.json
      - name: Provenance subjects (SHA-256 of every distribution)
        id: subjects
        run: |
          cd dist
          echo "hashes=$(sha256sum -- *.whl *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Sign every distribution with Sigstore (keyless, this workflow's identity)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
          upload-signing-artifacts: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '$0 ~ "^## \\[?" v "\\]?( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
      - name: Verify public release bytes without credentials
        run: >-
          uv run python scripts/verify_external_release.py
          --repository "${GITHUB_REPOSITORY}"
          --tag "${GITHUB_REF_NAME}"
          --source-commit "${GITHUB_SHA}"
          --artifact-dir dist
          --pypi-project scmle
          --attempts 6
          --retry-delay 10

  # SLSA level 3 provenance for every distribution, signed through Sigstore
  # and attached to the GitHub release. The generator is a reusable workflow
  # that verifies its own ref, which must be a full release tag
  # (refs/tags/vX.Y.Z): its builder-fetch.sh exits on a commit SHA, so it is
  # the one reference here pinned by tag. v2.1.0 is commit
  # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a; benchmarks/evidence/supply.py
  # checks that the tag still names that commit.
  provenance:
    needs: [publish]
    permissions:
      actions: read     # Read the workflow run the provenance describes.
      id-token: write   # Sign the provenance with Sigstore.
      contents: write   # Attach the provenance to the release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: "${{ needs.publish.outputs.hashes }}"
      upload-assets: true
