name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches the package version and the changelog
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('scml/__init__.py').read()).group(1))")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          [ "${init}" = "${version}" ] || { echo "scml.__version__ ${init} != ${version}"; exit 1; }
          grep -q "^## ${version}" CHANGELOG.md || { echo "CHANGELOG has no ${version} section"; exit 1; }

  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: LightGBM needs the OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
          --junitxml=release-platform.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py release-platform.xml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no API token is stored.
      contents: write   # Create the GitHub release.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: uv run pytest -q -W error::ResourceWarning --junitxml=release-full-suite.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py release-full-suite.xml
      - run: uv run python -m benchmarks.run_benchmarks --offline --seeds 5 --budget 120 --workers 2 --output results.json
      - run: uv run python -m benchmarks.check_regression results.json
      - run: uv build --python 3.14
      - run: uv run twine check dist/*
      - name: Verify reproducible and network-isolated artifacts
        run: scripts/verify_release_artifacts.sh
      - name: Smoke test the wheel and source distribution
        run: |
          uv venv --python 3.14 /tmp/release-wheel-env
          uv pip install --python /tmp/release-wheel-env/bin/python dist/*.whl
          /tmp/release-wheel-env/bin/scml --help
          /tmp/release-wheel-env/bin/python -c "import scml; print(scml.__version__)"
          uv venv --python 3.14 /tmp/release-sdist-env
          uv pip install --python /tmp/release-sdist-env/bin/python dist/*.tar.gz
          /tmp/release-sdist-env/bin/scml --help
          /tmp/release-sdist-env/bin/python -c "import scml; print(scml.__version__)"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 ~ "^"v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
