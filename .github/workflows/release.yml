name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version and the changelog
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('scml/__init__.py').read()).group(1))")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          [ "${init}" = "${version}" ] || { echo "scml.__version__ ${init} != ${version}"; exit 1; }
          grep -q "^## ${version}" CHANGELOG.md || { echo "CHANGELOG has no ${version} section"; exit 1; }

  test:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: LightGBM needs the OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --python 3.14 --extra boosting --extra optimization
      - run: uv run pytest -q tests/unit tests/property tests/leakage tests/integration/test_end_to_end.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing; no API token is stored.
      contents: write   # Create the GitHub release.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.14 --extra boosting --extra optimization
      - run: uv run pytest -q
      - run: uv run python -m benchmarks.run_benchmarks --offline --budget 240 --workers 2 --output results.json
      - run: uv run python -m benchmarks.check_regression results.json
      - run: uv build --python 3.14
      - run: uv run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 ~ "^"v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
