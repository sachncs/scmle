name: full-suite

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: full-suite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: complete test suite (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.14 --extra boosting --extra optimization
      - run: uv run pytest -q --cov=scml --cov-report=xml --durations=25
      - name: Enforce core contract coverage
        run: >-
          uv run coverage report
          --include=scml/contracts/*,scml/data/*,scml/evaluation/*,scml/governance/*,scml/inference/*,scml/monitoring/*
          --fail-under=85
      - name: Enforce critical mutation score
        run: |
          uv run mutmut run --max-children 4
          scripts/check_mutation_score.sh 70
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-suite-coverage
          path: coverage.xml
          if-no-files-found: ignore

  clean-clone:
    name: exact-SHA clean-clone rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the published repository into a fresh directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/super-charge-ml-clean-clone
          git -C /tmp/super-charge-ml-clean-clone checkout --detach "${GITHUB_SHA}"
          test -z "$(git -C /tmp/super-charge-ml-clean-clone status --porcelain)"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --directory /tmp/super-charge-ml-clean-clone --python 3.14 --extra boosting --extra optimization
      - name: Run the clean-clone acceptance slice
        run: >-
          uv run --directory /tmp/super-charge-ml-clean-clone pytest -q
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
          tests/integration/test_deployment.py
      - name: Verify the package entry point from the clean clone
        run: uv run --directory /tmp/super-charge-ml-clean-clone scml --help
