name: full-suite

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: full-suite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: complete test suite (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.14 --extra boosting --extra optimization --extra multimodal
      - run: >-
          uv run pytest -q -W error::ResourceWarning
          --cov=scmle --cov-report=xml --durations=25
          --junitxml=full-suite.xml
      - name: Reject unexplained skips and xfails
        run: uv run python scripts/check_pytest_skips.py full-suite.xml
      - name: Enforce core contract coverage
        run: >-
          uv run coverage report
          --include=scmle/contracts/*,scmle/data/*,scmle/evaluation/*,scmle/governance/*,scmle/inference/*,scmle/monitoring/*
          --fail-under=85
      - name: Run the long qualification simulations
        run: uv run python -m benchmarks.qualification --smoke --full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-suite-coverage
          path: |
            coverage.xml
            full-suite.xml
          if-no-files-found: ignore

  clean-clone:
    name: exact-SHA clean-clone rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone the published repository into a fresh directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/scmle-clean-clone
          git -C /tmp/scmle-clean-clone checkout --detach "${GITHUB_SHA}"
          test -z "$(git -C /tmp/scmle-clean-clone status --porcelain)"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --directory /tmp/scmle-clean-clone --python 3.14 --extra boosting --extra optimization --extra multimodal
      - name: Run the clean-clone acceptance slice
        run: >-
          uv run --directory /tmp/scmle-clean-clone pytest -q
          -W error::ResourceWarning
          tests/unit tests/property tests/leakage
          tests/integration/test_end_to_end.py
          tests/integration/test_deployment.py
          --junitxml=/tmp/clean-clone-suite.xml
      - name: Reject unexplained clean-clone skips and xfails
        run: >-
          uv run --directory /tmp/scmle-clean-clone
          python scripts/check_pytest_skips.py /tmp/clean-clone-suite.xml
      - name: Verify the package entry point from the clean clone
        run: uv run --directory /tmp/scmle-clean-clone scmle --help

  stability:
    name: repeated test stability and quarantine policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - run: >-
          uv run python scripts/check_test_stability.py
          --runs 3
          --quarantine tests/quarantine.json
          --output test-stability.json
          tests/unit/test_api_surface.py
          tests/unit/test_performance_contracts.py
          tests/unit/test_test_stability.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-stability
          path: test-stability.json
          if-no-files-found: error
