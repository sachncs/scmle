name: cloud-release

# Release a signed, approved model to a cloud, staging before production.
# It runs only when started by hand and only when the repository variable
# SCMLE_CLOUD_RELEASE is "true"; without it every job below is skipped. It
# needs, per provider, protected GitHub environments named "staging" and
# "production" with required reviewers (other than the person who starts the
# run), the environment variables listed in docs/CLOUD_RELEASE.md and a cloud
# role or service account that trusts this repository's OIDC token. No cloud
# key is stored anywhere. Nothing here has been run against a cloud account.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud to release to
        type: choice
        options: [aws, gcp]
        required: true
      release_dir:
        description: Folder with registry/ and approval.json for the model
        type: string
        default: release
      model:
        description: Registered model name
        type: string
        required: true
      version:
        description: Registered model version
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-release-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  guard:
    name: release enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.SCMLE_CLOUD_RELEASE }}
        run: |
          if [ "${ENABLED}" = "true" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "cloud release is off: set the repository variable SCMLE_CLOUD_RELEASE to true"
          fi

  build-scan:
    name: build and scan the image
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.14
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Package the registered bundle as a service folder
        env:
          RELEASE_DIR: ${{ inputs.release_dir }}
          MODEL: ${{ inputs.model }}
          VERSION: ${{ inputs.version }}
          SCMLE_SIGNING_KEY: ${{ secrets.SCMLE_SIGNING_KEY }}
        run: uv run scmle package "${RELEASE_DIR}/registry/${MODEL}/v${VERSION}" --output service
      - name: Resolve the base image to a digest and build an OCI archive
        run: |
          uv run python -m scmle.deploy.base_image resolve --image python:3.12-slim --output service/base-image.lock.json
          base="$(uv run python -m scmle.deploy.base_image argument --lock service/base-image.lock.json)"
          docker buildx build service --build-arg BASE_IMAGE="${base}" \
            --output "type=oci,dest=image.tar"
          digest="$(tar -xOf image.tar index.json | jq -r '.manifests[0].digest')"
          echo "${digest}" > image.digest
      - name: Scan the image and apply the vulnerability policy
        run: |
          trivy image --input image.tar --format json --output scan.json
          uv run python scripts/vuln_gate.py scan.json --policy deploy/vuln-policy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: |
            image.tar
            image.digest
            scan.json

  staging:
    name: staging
    needs: [guard, build-scan]
    if: needs.guard.outputs.enabled == 'true'
    uses: ./.github/workflows/cloud-deploy.yml
    with:
      environment: staging
      provider: ${{ inputs.provider }}
      release_dir: ${{ inputs.release_dir }}
      model: ${{ inputs.model }}
      version: ${{ inputs.version }}
    secrets: inherit

  production:
    name: production
    needs: [guard, staging]
    if: needs.guard.outputs.enabled == 'true'
    uses: ./.github/workflows/cloud-deploy.yml
    with:
      environment: production
      provider: ${{ inputs.provider }}
      release_dir: ${{ inputs.release_dir }}
      model: ${{ inputs.model }}
      version: ${{ inputs.version }}
    secrets: inherit
