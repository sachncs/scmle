name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or a `scml` command; a small synthetic dataset is ideal.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: super-charge-ml version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and operating system
      placeholder: "3.12, Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
