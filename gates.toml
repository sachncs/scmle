[split.resident.open]
site = "scmle.data.splitting.splitters.lockbox:Resident.open"
error = "LeakageError"
claim = "C2, C8"
passes = "The token matches, the rows were not released before, and either no binding is set or the given binding equals it."
blocks = "The token differs from the set's token; the rows were already released; a binding is set and the given binding differs."
override = "none"
variables = []

[split.resident.reopen]
site = "scmle.assurance.custody.journal:Journal.admit"
error = "BlockedError"
claim = "C2, C8"
passes = "The run has a custody journal, its chain is intact, and it records no opening of the test set."
blocks = "The run has no custody journal (copied, predates the journal, or deleted), or the journal records that the test set was already opened; the resumed run is refused."
override = "none"
variables = []

[split.resident.journal]
site = "scmle.assurance.custody.journal:Journal.read"
error = "BlockedError"
claim = "C2, C8"
passes = "There is no journal, or every entry's previous digest and own digest match the hash chain."
blocks = "An entry was edited, removed or reordered, so its digest or link to the previous entry no longer matches."
override = "none"
variables = []

[split.resident.records]
site = "scmle.pipeline.archive:Directory.read"
error = "BlockedError"
claim = "C2, C8"
passes = "Every stage record under stages/ parses, has the current record format, and its digest and configuration hash match the run being resumed."
blocks = "A stage record is unreadable or has no digest, has another record format, was edited after it was written, or was written under another configuration; the resumed run is refused."
override = "none; start a new run (records are only read when a run is resumed)."
variables = []

[split.rolling.partition]
site = "scmle.data.splitting.splitters.temporal:Rolling.partition"
error = "BlockedError"
claim = "C5"
passes = "The time column orders the rows and at least MIN_ROLLING_FOLDS windows, each with at least MIN_ROLLING_TRAIN training rows, fit."
blocks = "The time column has unparseable or missing values (from chronological_holdout); fewer than MIN_ROLLING_FOLDS rolling windows fit."
override = "Shorten validation.rolling.horizon, validation.rolling.window or validation.embargo, as the error message says."
variables = ["MIN_ROLLING_FOLDS", "MIN_ROLLING_TRAIN", "validation.folds", "validation.rolling.horizon", "validation.rolling.window", "validation.embargo", "validation.test", "data.time", "data.horizon"]

[split.stratified.folds]
site = "scmle.data.splitting.splitters.splits:Stratified.cross_validation_folds"
error = "BlockedError"
claim = "C5"
passes = "Every class has at least MIN_STRATUM_ROWS development rows; folds are reduced to the minority class size if needed."
blocks = "The smallest class in the development partition has fewer than MIN_STRATUM_ROWS rows."
override = "none"
variables = ["MIN_STRATUM_ROWS", "validation.folds"]

[split.stratified.stratify]
site = "scmle.data.splitting.splitters.splits:Stratified.stratifier"
error = "BlockedError"
claim = "C5"
passes = "Every class has at least MIN_STRATUM_ROWS rows in the full data."
blocks = "A class has fewer than MIN_STRATUM_ROWS rows."
override = "none"
variables = ["MIN_STRATUM_ROWS", "data.target"]

[split.temporal.holdout]
site = "scmle.data.splitting.splitters.temporal:Chronology.chronological_holdout"
error = "BlockedError"
claim = "C5"
passes = "Some row has a timestamp earlier than the test window's first timestamp (the window starts at a timestamp, so no timestamp is on both sides) and, with validation.entities unseen, the held-out entities have rows in the test window and the others rows before it."
blocks = "Every row before the planned cut shares the test window's first timestamp; or, with validation.entities unseen, the development or test side is left empty. Unparseable times and bad entity columns are raised by Chronology.times and Chronology.entities."
