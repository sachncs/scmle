error = "BlockedError"
claim = "C1"
passes = "At least ROWS (299) held-out rows; the largest probability difference (regression: scaled difference) is at most the tolerance (gamma_1024 for float32, about 6.1e-5); no label differs on a row whose native margin exceeds twice the tolerance."
blocks = "No held-out rows (Bundle.export_onnx and scmle export-onnx verify by default) or fewer than ROWS; a difference above the tolerance or NaN; a label disagreement beyond the margin. The blocked graph is removed."
override = "Pass a larger tolerance (Bundle.export_onnx(path, check=rows, tolerance=...), or --tolerance); or skip the check with unverified=True (--unverified), which the export manifest records as verified false."
variables = ["tolerance", "check", "unverified", "OPERATIONS", "RATE", "CONFIDENCE"]
