[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magicml"
version = "0.1.0b1"
description = "Autonomous, leakage-safe ML lifecycle framework for tabular data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["automl", "machine-learning", "tabular", "mlops", "leakage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
    "pyarrow>=22",
    "pydantic>=2.12",
    "scikit-learn>=1.8",
    "scipy>=1.16.2",
    "joblib>=1.5",
    "threadpoolctl>=3.6",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.6", "xgboost>=3.0"]
catboost = ["catboost>=1.2.8"]  # no free-threaded (3.14t) wheel yet
# Keras 3 runs on the PyTorch backend inside the same worker process.
deeplearning = ["torch>=2.8", "keras>=3.5"]
# TabPFN needs an accepted Prior Labs license and TABPFN_TOKEN for its weights,
# so it is not part of the `all` extra.
tabpfn = ["tabpfn>=2.0"]
# ONNX export; onnxruntime has no free-threaded (3.14t) wheel yet.
onnx = ["skl2onnx>=1.17", "onnxruntime>=1.20"]
optimization = ["optuna>=4.0"]
sampling = ["imbalanced-learn>=0.14.1"]
polars = ["polars>=1.0"]
tracking = ["mlflow>=3.0"]
benchmarks = ["huggingface_hub>=0.25"]
distributed = ["ray>=2.40"]
all = [
    "magicml[boosting,catboost,deeplearning,optimization,sampling,polars,tracking,distributed,benchmarks]",
]

[project.scripts]
magicml = "mml.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "hypothesis>=6.140",
    "ruff>=0.14",
    "mypy>=1.18",
    "pandas-stubs>=3.0",
    "bandit>=1.9",
    "pip-audit>=2.9",
    "twine>=6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["mml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "ANN", "SIM", "RUF", "C4", "SLF"]
ignore = ["ANN401", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = true
known-first-party = ["mml"]
case-sensitive = false
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "E501", "SLF"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

# On Linux, take the CPU build of PyTorch: the default wheel drags in several
# gigabytes of CUDA libraries that CPU-only machines and CI do not need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
