[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scmle"
version = "0.1.0b1"
description = "Autonomous, leakage-safe ML lifecycle framework for tabular data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sachin", email = "sch.cs.96@gmail.com" }]
maintainers = [{ name = "Sachin", email = "sch.cs.96@gmail.com" }]
keywords = ["automl", "machine-learning", "tabular", "mlops", "leakage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
    "pyarrow>=22",
    "pydantic>=2.12",
    "scikit-learn>=1.8",
    "scipy>=1.16.2",
    "joblib>=1.5",
    "threadpoolctl>=3.6",
    "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.6", "xgboost>=3.0"]
catboost = ["catboost>=1.2.8"]  # no free-threaded (3.14t) wheel yet
# Keras 3 runs on the PyTorch backend inside the same worker process.
deeplearning = ["torch>=2.8", "keras>=3.5", "filelock>=4.2.1"]
# TabPFN needs an accepted Prior Labs license and TABPFN_TOKEN for its weights,
# so it is not part of the `all` extra.
tabpfn = ["tabpfn>=2.0", "filelock>=4.2.1"]
# Pretrained sentence embeddings for text columns (downloads a model on first
# use); not part of `all` because it pulls the transformers stack.
embeddings = ["sentence-transformers>=3.0", "filelock>=4.2.1"]
# ONNX export (onnxmltools adds LightGBM and XGBoost); onnxruntime has no
# free-threaded (3.14t) wheel yet. Any model can ship with `scmle package`.
onnx = ["skl2onnx>=1.17", "onnxruntime>=1.20", "onnxmltools>=1.13"]
optimization = ["optuna>=4.0"]
sampling = ["imbalanced-learn>=0.14.1"]
polars = ["polars>=1.0"]
spreadsheets = ["openpyxl>=3.1"]
tracking = ["mlflow>=3.0"]
benchmarks = ["huggingface_hub>=0.25"]
# OpenML tasks and splits for benchmarks/sota; not part of `all`.
sota = ["openml>=0.15"]
distributed = ["ray>=2.40"]
multimodal = ["pillow>=13.0"]
all = [
    "scmle[boosting,catboost,deeplearning,optimization,sampling,polars,spreadsheets,tracking,distributed,benchmarks,multimodal]",
]

[project.urls]
Homepage = "https://github.com/sachncs/scmle"
Documentation = "https://sachncs.github.io/scmle/"
Issues = "https://github.com/sachncs/scmle/issues"
Changelog = "https://github.com/sachncs/scmle/blob/master/CHANGELOG.md"

[project.scripts]
scmle = "scmle.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.140",
    "ruff>=0.14",
    "mypy>=1.18",
    "pandas-stubs>=3.0",
    "bandit>=1.9",
    "mutmut>=3.8",
    "pip-audit>=2.9",
    "twine>=6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["scmle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"
src = ["."]
# mutmut's generated copy of the tree is not source; website/ holds the
# static site and its one-off page generator, not the package
extend-exclude = ["mutants", "website"]

[tool.ruff.lint]
# Every rule, plus the preview rule DOC (documented arguments, returns and
# raises). `preview = true` with `explicit-preview-rules = true` switches on only
# the preview rules named here, not all preview behaviour.
select = ["ALL", "DOC"]
ignore = [
    # The formatter and the Google docstring convention settle these.
    "COM812",
    "ISC001",
    "D203",
    "D213",
    # No copyright header in every file.
    "CPY001",
    # It would force `import numpy as np`; import aliases are forbidden
    # (tests/unit/test_conventions.py).
    "ICN001",
    # They would force a new exception class per message and a `msg = ...` line
    # before each `raise`; the package already has about 85 exception classes.
    "TRY003",
    "EM101",
    "EM102",
    # Boolean positional parameters and too many arguments: fixing either
    # changes public signatures that the API snapshot pins. Known debt.
    "FBT001",
    "FBT002",
    "PLR0913",
    "PLR0917",
    # Explicit `Any`, kept to describe values that really are arbitrary.
    "ANN401",
    # Mutable class defaults, ignored before this configuration.
    "RUF012",
    # It asks for TypeError where the code raises ValueError for a type check;
    # changing the exception type breaks callers that catch the current one.
    "TRY004",
]
preview = true
explicit-preview-rules = true
# underscore names are banned by tests/unit/test_conventions.py
dummy-variable-rgx = "^(_\\w*|ignored)$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = true
known-first-party = ["scmle"]
case-sensitive = false
order-by-type = false

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic values, are documented by their names, and import
# inside functions to test lazy imports.
"tests/**" = ["S", "PLR", "D", "DOC", "ANN", "INP001", "PLC0415", "ARG", "FBT", "PT011", "PT018", "E501", "SLF", "T201", "C901", "TRY", "EM", "PD901"]
# The command line tool and the demo print: printing is their output.
"scmle/cli.py" = ["T201"]
"scmle/deploy/demo.py" = ["T201"]
# Command-line tools and benchmark scripts print and are not packages.
"scripts/**" = ["T201", "INP001", "S", "PLC0415"]
"benchmarks/**" = ["T201", "INP001", "S", "PLC0415"]
"examples/**" = ["T201", "INP001", "S", "D", "DOC", "ANN"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "deprecated",
]
# Third-party packages that ship no type information are treated as Any. This
# hides missing stubs, so it is a known gap; narrow it to per-module overrides
# as stubs appear. `explicit-override` is not enabled: `typing.override` needs
# Python 3.12 and `typing_extensions` is not a declared dependency.
ignore_missing_imports = true

# On Linux, take the CPU build of PyTorch: the default wheel drags in several
# gigabytes of CUDA libraries that CPU-only machines and CI do not need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
