[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magicml"
version = "0.1.0.dev0"
description = "Autonomous, leakage-safe ML lifecycle framework for tabular data"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
boosting = ["lightgbm", "xgboost"]
catboost = ["catboost"]  # needs a CPython 3.14 wheel; build from source otherwise
optimization = ["optuna"]
tracking = ["mlflow"]
distributed = ["ray"]
all = ["magicml[boosting,catboost,optimization,tracking,distributed]"]

[project.scripts]
magicml = "mml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["mml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "ANN", "SIM", "RUF", "C4", "SLF"]
ignore = ["ANN401", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = true
known-first-party = ["mml"]
case-sensitive = false
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "E501", "SLF"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
